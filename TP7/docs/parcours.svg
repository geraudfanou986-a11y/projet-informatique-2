<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, Calibri, sans-serif">
  <rect width="960" height="470" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1b4965">TP7 — Parcours des deux rôles</text>

  <rect x="24" y="56" width="912" height="390" rx="8" fill="#e8f1f8" stroke="#cbd5de"/>
  <text x="44" y="84" font-size="16" font-weight="bold" fill="#1b4965">Étudiant — 4 écrans</text>
  <text x="516" y="84" font-size="16" font-weight="bold" fill="#1b4965">Responsable — 3 écrans</text>
  <line x1="500" y1="62" x2="500" y2="440" stroke="#cbd5de" stroke-width="2"/>

  <g fill="#ffffff" stroke="#1b4965" stroke-width="1.5">
    <rect x="44" y="104" width="140" height="56" rx="6"/>
    <rect x="230" y="104" width="180" height="56" rx="6"/>
    <rect x="456" y="104" width="180" height="56" rx="6"/>
    <rect x="230" y="216" width="180" height="56" rx="6"/>
    <rect x="44" y="328" width="366" height="82" rx="6"/>

    <rect x="526" y="104" width="150" height="56" rx="6"/>
    <rect x="722" y="104" width="190" height="56" rx="6"/>
    <rect x="626" y="216" width="286" height="56" rx="6"/>
    <rect x="626" y="328" width="286" height="82" rx="6"/>
  </g>

  <g font-size="13" fill="#1d2733" text-anchor="middle">
    <text x="114" y="126">1. Connexion</text><text x="114" y="145" font-size="11">POST /api/connexion</text>
    <text x="320" y="126">2. Mes demandes</text><text x="320" y="145" font-size="11">GET /api/demandes/mes</text>
    <text x="546" y="126">3. Formulaire de dépôt</text><text x="546" y="145" font-size="11">POST /api/demandes</text>
    <text x="320" y="238">4. Détail</text><text x="320" y="257" font-size="11">textContent, jamais innerHTML</text>
    <text x="227" y="356">Vérification du rendu sécurisé</text>
    <text x="227" y="378" font-size="11">saisir &lt;b&gt;test&lt;/b&gt; → texte affiché tel quel</text>
    <text x="227" y="397" font-size="11">aucune balise interprétée</text>

    <text x="601" y="126">1. Connexion</text><text x="601" y="145" font-size="11">POST /api/connexion</text>
    <text x="817" y="126">2. Liste à traiter</text><text x="817" y="145" font-size="11">GET /api/demandes</text>
    <text x="769" y="238">3. Décision</text><text x="769" y="257" font-size="11">PATCH /api/demandes/{id}/statut</text>
    <text x="769" y="356">Rafraîchir la page</text>
    <text x="769" y="378" font-size="11">relecture depuis la base :</text>
    <text x="769" y="397" font-size="11">la persistance est prouvée</text>
  </g>

  <g stroke="#1b4965" stroke-width="2" fill="none" marker-end="url(#fleche)">
