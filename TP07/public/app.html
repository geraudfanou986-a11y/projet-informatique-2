<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace connecté de la plateforme de gestion des stages.">
  <title>Espace — Stageflow</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="chargement">
  <a class="skip-link" href="#contenu">Aller au contenu principal</a>

  <div class="app">
    <aside class="sidebar" aria-label="Navigation principale">
      <a class="brand" href="app.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18v13H3zM8 7V4h8v3M3 12h18"/>
          </svg>
        </span>
        Stageflow
      </a>
      <nav class="sidebar-nav" id="navigation"></nav>
      <div class="sidebar-foot">
        <div class="user-card" id="utilisateur"></div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <h1 id="titre-page">Espace</h1>
        <div class="spacer"></div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="recherche" type="search" placeholder="Rechercher une demande…" aria-label="Rechercher une demande">
        </div>
        <span class="role-pill" id="role-pill"></span>
        <button class="icon-btn" type="button" title="Actualiser" aria-label="Actualiser les données" onclick="location.reload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </header>

      <main class="contenu" id="contenu" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal" id="modale" hidden></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
